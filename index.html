<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Control de UGAX</title>
  <link rel="stylesheet" href="css/panel.css">
  <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
</head>
<body>
  <header>
    <h1>Control de UGAX</h1>
    <span id="stream-label">sala-stream-demo</span>
    <div id="conn"><div class="dot" id="dot"></div><span id="conn-txt">Conectado papu</span></div>
  </header>
  <div class="layout">
    <aside>
      <div class="sidebar-top">
        <section class="card">
          <div class="tabs">
            <button class="tab active" data-tab="tab-url">URL</button>
            <button class="tab" data-tab="tab-arch">Archivo</button>
            <button class="tab" data-tab="tab-txt">Texto</button>
          </div>
          <div class="tab-body active" id="tab-url">
            <label>URL del recurso</label>
            <input type="url" id="urlIn" placeholder="https://i.imgur.com/foto.jpg">
            <div class="hint">Soporta JPG, PNG, GIF, MP4, MP3, WEBM</div>
            <button class="btn primary" id="addUrl">Agregar</button>
          </div>
          <div class="tab-body" id="tab-arch">
            <div class="drop-zone" id="drop-zone">
              <div class="drop-icon">+</div>
              Arrastra archivos aqui o haz click
              <div class="hint">Sube a <b>Supabase Storage</b></div>
            </div>
            <input type="file" id="fileIn" multiple accept="image/*,video/*,audio/*" style="display:none">
            <div class="upload-list" id="upload-list"></div>
          </div>
          <div class="tab-body" id="tab-txt">
            <label>Texto</label>
            <input type="text" id="txtIn" placeholder="Escribe aqui...">
            <div class="grid2" style="margin-top:4px">
              <div><label>Tamano</label>
                <select id="selSz"><option value="36">Chico</option><option value="48" selected>Mediano</option><option value="72">Grande</option><option value="96">Gigante</option></select>
              </div>
              <div><label>Fondo</label>
                <select id="selBg"><option value="none" selected>Ninguno</option><option value="solid">Solido</option></select>
              </div>
            </div>
            <div class="grid2">
              <div><label>Color fondo</label><input type="color" id="txtBgCol" value="#000000"></div>
              <div><label>Opacidad %</label><input type="number" id="txtBgOp" min="0" max="100" value="60"></div>
            </div>
            <label style="margin-top:4px">Fondo transparente</label>
            <input type="color" id="txtCol" value="#ffffff">
            <div class="check-row" style="margin-top:4px">
              <label><input type="checkbox" id="txtBold"> Negrita</label>
              <label><input type="checkbox" id="txtItalic"> Cursiva</label>
            </div>
            <button class="btn primary" id="addTxt" style="margin-top:6px">Agregar texto</button>
          </div>
        </section>
        <section class="card" id="edit-section" style="display:none;margin-top:6px">
          <h2>Editar <span id="ed-name"></span></h2>
          <div style="padding:6px 8px">
            <div id="edit-media-fields"></div>
            <div id="edit-text-fields"></div>
            <div class="edit-group" style="margin-top:4px">
              <label>Opacidad</label>
              <div style="display:flex;align-items:center;gap:6px">
                <input type="range" id="ed-opacity" min="0" max="100" value="100" style="flex:1">
                <span id="ed-opacity-val" style="font-size:10px;width:28px;text-align:right">100</span>
              </div>
            </div>
            <div class="grid2" style="margin-top:4px">
              <div class="edit-group"><label>Left</label><input type="number" id="ed-x" min="0" max="1" step="0.01"></div>
              <div class="edit-group"><label>Top</label><input type="number" id="ed-y" min="0" max="1" step="0.01"></div>
            </div>
            <div class="grid2">
              <div class="edit-group"><label>Ancho</label><input type="number" id="ed-w" min="0.01" max="1" step="0.01"></div>
              <div class="edit-group"><label>Alto</label><input type="number" id="ed-h" min="0.01" max="1" step="0.01"></div>
            </div>
            <div style="margin-top:6px">
              <button class="btn danger" id="ed-del">Eliminar esta capa</button>
            </div>
          </div>
        </section>
      </div>
      <div class="source-list" id="source-list">
        <h2>Fuentes (<span id="count">0</span>)</h2>
        <div id="list"></div>
        <div class="empty" id="empty-msg">Sin capas. Agrega algo.</div>
      </div>
      <div class="toolbar">
        <button id="tb-add" title="Agregar fuente">+</button>
        <button id="tb-del" title="Eliminar fuente" class="danger">&#x2715;</button>
        <button id="tb-up" title="Subir capa">&#x25B2;</button>
        <button id="tb-down" title="Bajar capa">&#x25BC;</button>
      </div>
    </aside>
    <main>
      <div style="width:100%;text-align:center">
        <div class="canvas-wrap">
          <div id="canvas"></div>
        </div>
        <div class="canvas-note">Vista previa 16:9 | OBS usa la proporcion real</div>
      </div>
    </main>
  </div>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database-compat.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="js/control.js"></script>
</body>
</html>
